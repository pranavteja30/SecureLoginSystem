<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two-Factor Verification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Two-Factor Verification</h1>

        <p class="subtitle">
            Enter the 6-digit code from your authenticator application.
        </p>

        <form method="POST">

            <label for="code">
                Authentication Code
            </label>

            <input
                type="text"
                id="code"
                name="code"
                placeholder="Enter 6-digit code"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                required
            >

            <button type="submit">
                Verify
            </button>

        </form>

        <p class="switch">
            <a href="{{ url_for('logout') }}">
                Cancel and return to login
            </a>
        </p>

    </div>

</div>

</body>

</html>
